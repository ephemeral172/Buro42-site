version: '3'

services:
  buro42-site:
    # Образ из GHCR после push в main (.github/workflows/ci.yml → ghcr.io/<owner>/buro42-site).
    # Подставьте своего владельца пакета вместо YOUR_GITHUB_OWNER.
    image: ghcr.io/ephemeral172/buro42-site:latest

    labels:
      - "traefik.enable=true"
      # Замените домен на ваш хост
      - "traefik.http.routers.buro42.rule=Host(`buro42.example`)"
      - "traefik.http.routers.buro42.entrypoints=websecure"
      - "traefik.http.routers.buro42.tls=true"
      - "traefik.http.services.buro42.loadbalancer.server.port=80"
      - "traefik.http.routers.buro42.tls.certresolver=leresolver"

    networks:
      - traefik_net

    restart: unless-stopped

networks:
  traefik_net:
    external: true
