server {
    listen 80 default_server;
    server_name fullfaq.dev www.fullfaq.dev _;
    root /usr/share/nginx/html;

    # Статические файлы — возвращать 404 если не найдены.
    # ВАЖНО: НЕ делаем фолбэк на index.html для .js/.css и т.д.
    # Это исправляет "script.js: Unexpected token '<'" из embedded iframes.
    location ~* \.(js|css|json|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Изображения и иконки
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA — все маршруты React Router отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store";
    }
}
